name: iOS unsigned build (for AltStore sideload)

# Produces an UNSIGNED .ipa on a free GitHub-hosted macOS runner. No Apple
# Developer account is used or required at this step — code signing is
# explicitly disabled. AltServer (running on your own machine) does the
# signing afterward using your free Apple ID. See ADR-HEARTH-031.
#
# expo-dev-client is removed before prebuild: it's only needed to connect
# to a live Metro server during development, and its expo-dev-menu /
# expo-dev-launcher pods pull in asset catalogs that need an iOS
# Simulator runtime matching the exact SDK version — not something a
# fresh GitHub-hosted runner reliably has. This build embeds the JS
# bundle directly (the standard Release-config behavior) and doesn't
# need a dev-client shell at all.
on:
  workflow_dispatch: {}
  push:
    branches:
      - feature/ios-unsigned-build

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          # Needs Swift tools 6.2 (only shipped from Xcode 26 onward), but
          # 26.4+ has a stricter Swift/C++ interop check that this Expo SDK
          # 57 version's expo-modules-jsi header (RuntimeScheduler.h) fails
          # under (known upstream issue, expo/expo#46242, fixed on SDK 56
          # but not yet backported here). Pinning the earliest 26.x release
          # that still has Swift 6.2 tools, before that stricter check.
          xcode-version: "26.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Remove expo-dev-client (development-only, not needed for a standalone build)
        run: rm -rf node_modules/expo-dev-client node_modules/expo-dev-menu node_modules/expo-dev-launcher

      - name: Patch expo-modules-jsi for this Xcode/Swift toolchain
        # Genuine upstream compile failures under the Xcode 26.x available
        # here, all inside expo-modules-jsi's own source, not this app's code
        # (its Package.swift assumes Swift tools 6.2 fully supports things
        # this compiler doesn't yet):
        #  1. `weak let` (an immutable weak reference) — "'weak' must be a
        #     mutable variable" in 12 files. `weak var` fixes most of them.
        #  2. Three of those are `Sendable`-conforming classes, where a plain
        #     `weak var` then fails as "stored property ... is mutable" —
        #     Sendable requires immutability. `nonisolated(unsafe)` is the
        #     standard escape hatch: these are weak, ARC-managed references,
        #     inherently safe to read across concurrency domains.
        #  3. RuntimeScheduler.h's two constructors are marked
        #     SWIFT_RETURNS_RETAINED, which (confirmed by testing) isn't
        #     valid Swift/C++ interop syntax on a constructor at all — a
        #     constructor's return is implicitly retained already. Removing
        #     the annotation from just the constructors (not the class,
        #     which keeps its own trailing SWIFT_SHARED_REFERENCE) is the
        #     targeted fix; an earlier attempt at reordering the class-level
        #     attribute didn't change this error at all, confirming it
        #     wasn't a parse-ordering issue.
        #  4. Beyond that, JavaScriptRuntime.swift hits "sending 'x' risks
        #     causing data races" at multiple call sites — Swift 6 strict
        #     concurrency's region-based isolation checker rejecting pointer
        #     trampolines it can't statically prove safe. Patching each call
        #     site individually risks actually getting the concurrency
        #     annotations wrong in a Swift/C++ JSI bridge, which is the last
        #     place to guess. Reverting the package's own declared
        #     swiftLanguageModes from .v6 to .v5 is the direct fix: it turns
        #     this whole diagnostic class off at the source (weak let's
        #     syntax gap, fixed above, is independent of language mode, so
        #     this doesn't undo that fix).
        run: |
          set -euo pipefail
          grep -rl "weak let" node_modules/expo-modules-jsi | while read -r f; do
            sed -i '' 's/weak let/weak var/g' "$f"
          done
          for f in \
            node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI/Runtime/JavaScriptPropNameID.swift \
            node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI/Runtime/Values/JavaScriptError.swift \
            node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI/Runtime/Values/JavaScriptValue.swift; do
            sed -i '' 's/weak var runtime: JavaScriptRuntime?/nonisolated(unsafe) weak var runtime: JavaScriptRuntime?/' "$f"
          done
          SCHEDULER_H="node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI-Cxx/include/RuntimeScheduler.h"
          sed -i '' 's/SWIFT_RETURNS_RETAINED RuntimeScheduler(/RuntimeScheduler(/' "$SCHEDULER_H"
          PACKAGE_SWIFT="node_modules/expo-modules-jsi/apple/Package.swift"
          sed -i '' 's/swiftLanguageModes: \[\.v6\],/swiftLanguageModes: [.v5],/' "$PACKAGE_SWIFT"
          echo "--- Verifying patches applied ---"
          grep -n "weak var\|nonisolated" \
            node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI/Runtime/JavaScriptPropNameID.swift
          grep -n "RuntimeScheduler(" "$SCHEDULER_H"
          grep -n "swiftLanguageModes" "$PACKAGE_SWIFT"

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build unsigned .app
        run: |
          set -euo pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building $SCHEME from $WORKSPACE"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package unsigned .ipa
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products -maxdepth 1 -name "*.app" | head -n1)
          APP_NAME=$(basename "$APP_PATH")
          mkdir -p Payload
          cp -r "$APP_PATH" "Payload/$APP_NAME"
          zip -qr Hearth-unsigned.ipa Payload
          echo "Built: Hearth-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: Hearth-unsigned-ipa
          path: Hearth-unsigned.ipa
          retention-days: 14
