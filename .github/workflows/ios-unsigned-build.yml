name: iOS unsigned build (for AltStore sideload)

# Produces an UNSIGNED .ipa on a free GitHub-hosted macOS runner. No Apple
# Developer account is used or required at this step — code signing is
# explicitly disabled. AltServer (running on your own machine) does the
# signing afterward using your free Apple ID. See ADR-HEARTH-031.
on:
  workflow_dispatch: {}
  push:
    branches:
      - feature/ios-unsigned-build

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Patch Podfile — pin resource-bundle targets to device SDK
        run: |
          set -euo pipefail
          python3 - ios/Podfile <<'PY'
          import sys
          path = sys.argv[1]
          with open(path) as f:
              content = f.read()
          marker = "post_install do |installer|"
          # Xcode 16 treats CocoaPods resource-bundle-only targets (product
          # type "bundle") as multi-platform by default, which requires a
          # matching iphonesimulator runtime to be installed even when only
          # building for a real device. GitHub's macos-15 runner doesn't
          # ship one matching Xcode 16.2's SDK, so pin these targets to the
          # device SDK explicitly.
          patch = marker + """
              installer.pods_project.targets.each do |target|
                next unless target.respond_to?(:product_type) && target.product_type == "com.apple.product-type.bundle"
                target.build_configurations.each do |config|
                  config.build_settings["SDKROOT"] = "iphoneos"
                  config.build_settings["SUPPORTED_PLATFORMS"] = "iphoneos"
                end
              end
          """
          assert marker in content, "post_install hook not found in generated Podfile"
          content = content.replace(marker, patch, 1)
          with open(path, "w") as f:
              f.write(content)
          PY

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build unsigned .app
        run: |
          set -euo pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building $SCHEME from $WORKSPACE"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            SDKROOT=iphoneos \
            SUPPORTS_MACCATALYST=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package unsigned .ipa
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products -maxdepth 1 -name "*.app" | head -n1)
          APP_NAME=$(basename "$APP_PATH")
          mkdir -p Payload
          cp -r "$APP_PATH" "Payload/$APP_NAME"
          zip -qr Hearth-unsigned.ipa Payload
          echo "Built: Hearth-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: Hearth-unsigned-ipa
          path: Hearth-unsigned.ipa
          retention-days: 14
